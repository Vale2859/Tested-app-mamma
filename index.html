<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ANVAMED Manager</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">ANVAMED</div>
    <div class="login-subtitle">MANAGER</div>

    <input id="pinInput" type="password" placeholder="Inserisci PIN">
    <button id="loginBtn" class="primary-btn">Entra</button>
  </div>
</div>

<div class="app-shell">

  <!-- HEADER -->
  <header class="header">
    <div class="brand-title">ANVAMED</div>
    <div class="brand-subtitle">MANAGER</div>
    <button id="logoutBtn" class="logout-btn">Esci</button>
  </header>

  <main class="main-content">

    <!-- HOME -->
    <section id="page-home" class="page is-active">

      <div class="top-cards">
        <div class="stat-card">
          <p>Mese</p>
          <h2 id="monthTotalValue">€0</h2>
        </div>

        <div class="stat-card green">
          <p>Struttura</p>
          <h2 id="monthStructureValue">€0</h2>
        </div>

        <div class="stat-card purple">
          <p>Medici</p>
          <h2 id="monthDoctorsValue">€0</h2>
        </div>
      </div>

      <button id="openNewEntryBtn" class="main-btn">
        <div class="btn-plus">+</div>
        <div>
          <strong>Nuova registrazione</strong>
          <small>Inserisci prestazione</small>
        </div>
      </button>

      <div class="period-tabs">
        <button class="tab is-active" data-home-mode="day">Giorno</button>
        <button class="tab" data-home-mode="month">Mese</button>
        <button class="tab" data-home-mode="year">Anno</button>
      </div>

      <div id="homeFilterBox"></div>

      <div id="homeEntriesList" class="cards-list"></div>

    </section>

    <!-- MEDICI -->
    <section id="page-doctors" class="page">

      <div class="page-head">
        <h2>Medici</h2>
        <button id="addDoctorBtn" class="small-action-btn">+ Aggiungi</button>
      </div>

      <div class="backup-tools">
        <button id="exportBtn" class="small-action-btn">Backup</button>
        <input id="importFile" type="file" hidden>
        <label for="importFile" class="small-action-btn">Importa</label>
      </div>

      <div id="doctorCardsList" class="cards-list"></div>

    </section>

    <!-- PRESTAZIONI -->
    <section id="page-services" class="page">

      <h2>Prestazioni</h2>

      <select id="servicesDoctorSelect"></select>

      <input id="newServiceName" placeholder="Nome prestazione">
      <input id="newServicePerc" type="number" value="60">

      <button id="addServiceBtn" class="primary-btn">Salva prestazione</button>

      <div id="servicesList" class="cards-list"></div>

    </section>

    <!-- REPORT -->
    <section id="page-report" class="page">

      <h2>Report</h2>

      <div class="report-stats-grid">
        <div>POS<br><strong id="reportPosValue">0</strong></div>
        <div>Contanti<br><strong id="reportCashValue">0</strong></div>
        <div>Standard<br><strong id="reportStandardValue">0</strong></div>
        <div>Riservata<br><strong id="reportReservedValue">0</strong></div>
      </div>

      <canvas id="reportChart"></canvas>

    </section>

    <!-- FATTURE -->
    <section id="page-invoices" class="page">

      <h2>Fatture</h2>

      <div class="backup-tools">
        <button id="printPdfBtn" class="small-action-btn">PDF</button>
        <button id="goBackBtn" class="small-action-btn">Indietro</button>
      </div>

      <div id="invoiceList" class="cards-list"></div>

    </section>

  </main>

  <!-- MENU -->
  <footer class="menu">
    <button class="nav-btn is-active" data-page="home">🏠</button>
    <button class="nav-btn" data-page="doctors">👨‍⚕️</button>
    <button class="nav-btn" data-page="services">🧩</button>
    <button class="nav-btn" data-page="report">📊</button>
    <button class="nav-btn" data-page="invoices">🧾</button>
  </footer>

</div>

<!-- MODAL -->
<div id="entryModal" class="popup hidden">
  <div class="popup-box">

    <h2>Nuova registrazione</h2>

    <select id="entryDoctorSelect"></select>

    <input id="entryServiceInput" placeholder="Prestazione">

    <input id="entryDateInput" type="date">

    <input id="entryAmountInput" placeholder="Importo €">

    <input id="entryPercInput" value="60">

    <div class="actions">
      <button id="cancelEntryBtn" class="secondary-btn">Annulla</button>
      <button id="saveEntryBtn" class="primary-btn">Salva</button>
    </div>

  </div>
</div>

<script src="app.js"></script>

</body>
</html>
